name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: pip install -r requirements/dev.txt -e .
      - name: Lint (PEP 8 + numpy docstrings)
        run: |
          ruff check .
          ruff format --check .
      - name: Test (unit, API contract, training-serving parity, promotion gate)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build api dashboard mlflow
      - name: Start the API and check it answers
        run: |
          docker compose up -d --wait api
          curl --fail --silent http://localhost:8000/api/v1/health
      - name: Stop
        if: always()
        run: docker compose down
