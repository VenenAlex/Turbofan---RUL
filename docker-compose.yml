# Full stack:   docker compose up --build
# Retrain:      docker compose --profile train run --rm train   (then: docker compose restart api)
name: turbofan-rul

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    ports: ["8000:8000"]
    volumes:
      - ./models:/app/models:ro   # serves whatever the last promoted training run exported
    restart: unless-stopped

  dashboard:
    build: { context: ., dockerfile: docker/dashboard.Dockerfile }
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # read-only demo access without a login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rul-service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  mlflow:
    build: { context: ., dockerfile: docker/train.Dockerfile }
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    ports: ["5000:5000"]
    volumes:
      - mlflow-data:/mlflow

  train:
    build: { context: ., dockerfile: docker/train.Dockerfile }
    profiles: ["train"]   # only runs when asked for
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models
    depends_on: [mlflow]

volumes:
  mlflow-data:
